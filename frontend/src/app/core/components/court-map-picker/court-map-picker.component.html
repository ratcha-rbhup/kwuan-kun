<div class="ak-court-map-wrapper shadow-xs">
  <!-- Map Canvas & Relative Overlays -->
  <div class="map-viewport-frame" [style.height]="isMapExpanded() ? '380px' : height">
    
    <!-- Leaflet Target Map -->
    <div #mapContainer class="leaflet-map-canvas"></div>

    <!-- Floating Center Pin (Picker Mode Only - Grab / Food Delivery Style) -->
    <div *ngIf="mode === 'picker'" class="center-pin-container-mini" [class.dragging]="isDragging()">
      <div class="center-pin-mini">
        <svg viewBox="0 0 38 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Pin Base Drop -->
          <path d="M19 0C8.50659 0 0 8.50659 0 19C0 32.25 16.5 46.5 17.8 47.6C18.5 48.2 19.5 48.2 20.2 47.6C21.5 46.5 38 32.25 38 19C38 8.50659 29.4934 0 19 0Z" fill="#10B981"/>
          <!-- Inner White Glow Circle -->
          <circle cx="19" cy="19" r="14" fill="#FFFFFF"/>
          <!-- Center Shuttlecock Circle -->
          <circle cx="19" cy="19" r="11.5" fill="#047857"/>
          <!-- Shuttlecock Cork Dome Base -->
          <path d="M17.5 22.8C17.5 24.3 18.2 25.2 19 25.2C19.8 25.2 20.5 24.3 20.5 22.8C20.5 22.2 19.8 22 19 22C18.2 22 17.5 22.2 17.5 22.8Z" fill="#FFFFFF"/>
          <!-- Shuttlecock Feathers Flare & Struts -->
          <path d="M15 14L17.5 22M23 14L20.5 22M19 13.8V22M17 14.2L18.2 22M21 14.2L19.8 22" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
          <!-- Shuttlecock Thread Ties -->
          <path d="M15.8 17C16.8 17.5 21.2 17.5 22.2 17" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M16.5 19.5C17.3 20 20.7 20 21.5 19.5" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="pin-shadow-mini"></div>
    </div>

    <!-- Map Floating Overlays & Actions (Top Right) -->
    <div class="map-controls-overlay">
      <!-- GPS Current Location Button -->
      <button 
        type="button" 
        class="map-ctrl-btn gps-btn" 
        [class.loading]="isLocating()"
        (click)="getCurrentLocation()" 
        title="หาพิกัดตำแหน่งปัจจุบันของคุณ">
        <i class="fa-solid fa-location-crosshairs" [class.fa-spin]="isLocating()"></i>
      </button>

      <!-- Expand / Collapse Toggle -->
      <button 
        type="button" 
        class="map-ctrl-btn expand-btn" 
        (click)="toggleMapExpand()" 
        [title]="isMapExpanded() ? 'ย่อแผนที่' : 'ขยายแผนที่เต็ม'">
        <i class="fa-solid" [ngClass]="isMapExpanded() ? 'fa-compress' : 'fa-up-right-and-down-left-from-center'"></i>
      </button>
    </div>

    <!-- Live Dragging Floating Indicator -->
    <div *ngIf="mode === 'picker' && isDragging()" class="map-drag-tooltip">
      <i class="fa-solid fa-hand-pointer me-1"></i> ปล่อยเพื่อเลือกตำแหน่งนี้
    </div>

    <!-- Floating Clean Coordinate Pill (Bottom Left of Map - In View Mode) -->
    <div *ngIf="mode === 'view' && showCoordinateBadge" class="map-floating-coord-pill shadow-xs">
      <i class="fa-solid fa-location-dot text-danger me-1"></i>
      <span>GPS {{ currentLat() }}, {{ currentLng() }}</span>
    </div>
  </div>

  <!-- Instruction Bar: Only for Picker Mode (No duplicate buttons in View Mode) -->
  <div *ngIf="mode === 'picker'" class="map-footer-bar p-2.5 px-3 bg-white border-top d-flex flex-wrap align-items-center justify-content-between gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="ak-badge ak-badge-active" *ngIf="showCoordinateBadge">
        <i class="fa-solid fa-location-crosshairs text-success me-1"></i>
        {{ currentLat() }}, {{ currentLng() }}
      </span>
      <span class="text-secondary small">
        เลื่อนแผนที่ให้หมุดตรงตำแหน่งทางเข้าสนาม
      </span>
    </div>

    <button type="button" class="btn btn-sm btn-outline-success rounded-pill px-2.5 py-0.5 small" (click)="openGoogleMaps()" title="ทดสอบเปิดดูตำแหน่งบน Google Maps">
      <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> ตรวจสอบพิกัด
    </button>
  </div>
</div>
