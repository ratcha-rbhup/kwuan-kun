<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Feather Gradient: Vivid Mint to Energetic Emerald -->
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Wing Highlight Gradient -->
    <linearGradient id="wingHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Cork Base Gradient -->
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Mask to punch transparent holes in 'A' -->
    <mask id="symbolMask">
      <!-- White reveals everything -->
      <rect width="200" height="200" fill="#FFFFFF" />
      <!-- Black cuts out inner triangle and lower cage -->
      <polygon points="100,44 107,78 93,78" fill="#000000" />
      <polygon points="91,88 109,88 114,118 86,118" fill="#000000" />
    </mask>

    <filter id="symbolShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.16" />
    </filter>
  </defs>

  <g filter="url(#symbolShadowLight)">
    <!-- 1. LEFT FEATHER WING -->
    <path d="M44 32 C34 46, 26 72, 32 108 C36 114, 46 116, 54 114 C62 102, 65 74, 60 52 C56 42, 50 35, 44 32 Z" 
          fill="url(#wingHighlight)" />

    <!-- 2. RIGHT FEATHER WING -->
    <path d="M156 32 C166 46, 174 72, 168 108 C164 114, 154 116, 146 114 C138 102, 135 74, 140 52 C144 42, 150 35, 156 32 Z" 
          fill="url(#featherGrad)" />

    <!-- 3. CENTRAL 'A' SHAPED SHUTTLECOCK CROWN (with transparent cutouts) -->
    <path d="M100 18 L138 116 C138 116, 128 120, 118 118 L111 96 H89 L82 118 C72 120, 62 116, 62 116 L100 18 Z" 
          fill="url(#featherGrad)" 
          mask="url(#symbolMask)" />

    <!-- Vertical String Accents inside cage -->
    <line x1="95" y1="88" x2="93" y2="118" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <line x1="100" y1="88" x2="100" y2="118" stroke="#A3E635" stroke-width="2.5" stroke-linecap="round" />
    <line x1="105" y1="88" x2="107" y2="118" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

    <!-- Shaft Ribs connecting to cork -->
    <line x1="72" y1="116" x2="75" y2="136" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    <line x1="86" y1="118" x2="87" y2="136" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <line x1="100" y1="118" x2="100" y2="136" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
    <line x1="114" y1="118" x2="113" y2="136" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <line x1="128" y1="116" x2="125" y2="136" stroke="#059669" stroke-width="3" stroke-linecap="round" />

    <!-- Shuttlecock Middle Rib Ribbon / Collar -->
    <rect x="70" y="132" width="60" height="5" rx="2.5" fill="#A3E635" />

    <!-- 4. SHUTTLECOCK CORK BASE -->
    <path d="M72 138 C72 138, 70 162, 82 174 C90 182, 110 182, 118 174 C130 162, 128 138, 128 138 Z" 
          fill="url(#corkGrad)" />
    
    <!-- Cork Gloss Highlight (Bottom Curve) -->
    <path d="M84 168 C92 176, 108 176, 116 168" 
          stroke="#A3E635" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>
</svg>
